<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Year 8 Science — All 14 Narrated Studio Masterclasses</title>
<style>
  /* System + progressive web font stack */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 20% 0%, #111f3d 0%, #060a14 68%);
    color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; padding: 28px 22px 56px;
  }
  .wrap { max-width: 1320px; margin: 0 auto; }
  .hero {
    border-radius: 24px; padding: 32px; margin-bottom: 24px;
    background: linear-gradient(135deg, rgba(16,185,129,0.14), rgba(56,189,248,0.12), rgba(168,85,247,0.14));
    border: 1px solid rgba(148,163,184,0.22);
    display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.7rem, 3vw, 2.4rem); margin: 8px 0; }
  .hero p { color: #cbd5e1; max-width: 680px; line-height: 1.55; font-size: 0.96rem; }
  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .f-btn {
    background: #0d1424; color: #cbd5e1; border: 1px solid rgba(148,163,184,0.22);
    padding: 9px 18px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 0.86rem; cursor: pointer;
  }
  .f-btn.active { background: #38bdf8; color: #041019; border-color: transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(295px, 1fr)); gap: 16px; }
  .topic-card {
    text-align: left; font-family: inherit; cursor: pointer; text-decoration: none; color: inherit; background: #0d1424;
    border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .topic-card:hover { transform: translateY(-3px); border-color: var(--card-accent); box-shadow: 0 16px 36px rgba(0,0,0,0.45); }
  .card-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.76rem; font-weight: 800; }
  .subj-pill { color: var(--card-accent); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--card-border); }
  .meta-pill { color: #94a3b8; }
  .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; color: #fff; }
  .card-desc { color: #94a3b8; font-size: 0.87rem; line-height: 1.48; flex: 1; }
  .card-footer { display: flex; justify-content: space-between; font-size: 0.76rem; color: #cbd5e1; padding-top: 10px; border-top: 1px solid rgba(148,163,184,0.14); font-weight: 600; }
</style>
</head>

<script>
function openTopic(u) { window.location.assign(u); }
function filterSubj(s, btn) {
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.topic-card').forEach(c => {
    c.style.display = (s === 'ALL' || c.getAttribute('data-subject') === s) ? 'flex' : 'none';
  });
}
</script>
